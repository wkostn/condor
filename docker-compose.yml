services:
  condor:
    build: .
    image: hummingbot/condor:latest
    container_name: condor-bot
    restart: unless-stopped
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      ADMIN_USER_ID: ${ADMIN_USER_ID}
    env_file:
      - .env
    volumes:
      # Persistence data (pickle file will be created as data/condor_bot_data.pickle)
      - ./data:/app/data
    networks:
      - hummingbird_default
    ports:
      - "8088:8088"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  hummingbird_default:
    external: true
